apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-lab
  labels:
    app.kubernetes.io/name: cv-lab
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cv-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cv-lab
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cv-lab
          image: ghcr.io/script-repo/cvlab-retail-supermarket-grocer/cvlab:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cvlab-config
          env:
            - name: NAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: nai-credentials
                  key: NAI_BASE_URL
                  optional: true
            - name: NAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nai-credentials
                  key: NAI_API_KEY
                  optional: true
            - name: NAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: nai-credentials
                  key: NAI_MODEL
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ultralytics
              mountPath: /app/.ultralytics
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ultralytics
          emptyDir: {}
        - name: data
          emptyDir: {}
