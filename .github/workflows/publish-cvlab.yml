name: Publish cvlab image

on:
  push:
    branches: [main]
    paths:
      - "cv-lab/backend/**"
      - "cv-lab/frontend/**"
      - "cv-lab/backend/Dockerfile"
      - "cv-lab/.dockerignore"
      - ".github/workflows/publish-cvlab.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-cvlab-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/cvlab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=CVLAB Retail Computer-Vision Lab
            org.opencontainers.image.description=FastAPI live-analysis app for retail / supermarket / grocery CV use cases

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: cv-lab
          file: cv-lab/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Update GitOps image tag
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("deploy/gitops/db-project-002/kustomization.yaml")
          text = path.read_text()
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.strip().startswith("newTag:"):
                  lines[index] = f"    newTag: {os.environ['IMAGE_TAG']}"
                  break
          else:
              raise SystemExit("newTag not found in GitOps kustomization")
          path.write_text("\n".join(lines) + "\n")
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/gitops/db-project-002/kustomization.yaml
          git commit -m "Deploy cvlab ${IMAGE_TAG}"
          git push
