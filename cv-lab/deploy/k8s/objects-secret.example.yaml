# Copy to objects-secret.yaml and fill in real Nutanix Objects access keys
# (Prism Central -> Objects -> Access Keys). Do NOT commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: objects-credentials
  namespace: retail-supermarket-grocery-cv
type: Opaque
stringData:
  S3_ACCESS_KEY: "REPLACE_WITH_OBJECTS_ACCESS_KEY"
  S3_SECRET_KEY: "REPLACE_WITH_OBJECTS_SECRET_KEY"
