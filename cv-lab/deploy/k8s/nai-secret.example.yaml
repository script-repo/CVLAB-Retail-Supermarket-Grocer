# LLM credentials for the agentic-ops layer. Works with any OpenAI-compatible
# API (Nutanix Enterprise AI / NAI, vLLM, Ollama, OpenAI, ...).
# Copy to nai-secret.yaml, fill in the real values, then:
#   kubectl apply -f nai-secret.yaml
# Never commit nai-secret.yaml (the tarball/ConfigMap must not contain keys).
apiVersion: v1
kind: Secret
metadata:
  name: nai-credentials
  namespace: retail-supermarket-grocery-cv
type: Opaque
stringData:
  NAI_BASE_URL: "https://your-llm-endpoint/v1"
  NAI_API_KEY: "<api-key-here>"
  NAI_MODEL: "<model-name>"
