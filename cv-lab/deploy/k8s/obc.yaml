# Provisions a real S3 bucket from the in-cluster Ceph RGW object store.
# Creates (in this namespace):
#   ConfigMap/retail-supermarket-grocery-cv-bucket  -> BUCKET_HOST, BUCKET_PORT, BUCKET_NAME
#   Secret/retail-supermarket-grocery-cv-bucket     -> AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: retail-supermarket-grocery-cv-bucket
  namespace: retail-supermarket-grocery-cv
spec:
  generateBucketName: retail-supermarket-grocery-cv
  storageClassName: dkp-object-store
